</style></head><body><div id="app"></div><script>const services=['Visiting Cards','Photocopy & Books Printing','Thesis Printing & Binding','Spiral / Tape / Gum Binding','Digital & Offset Printing','Flyers & Brochures','Stickers & Labels','Packaging Printing','Panaflex & Banners','Standees & Backdrops','Mugs & Bottles Printing','Caps & T-Shirt Printing','DTF / UV DTF Printing','Photo Frames','Art & Office Stationery'];
const seedFAQs=[
{q:'How can I order?',a:'You can place an enquiry here or on WhatsApp. Please share product, size, quantity, design and delivery city.'},
{q:'Do you offer bulk printing?',a:'Yes, bulk enquiries are welcome. Share quantity and specifications for a confirmed quotation.'},
{q:'What is the price?',a:'Prices depend on size, material, quantity and finishing. Please share your requirements for an accurate quote.'},
{q:'Do you provide delivery?',a:'Delivery availability and charges will be confirmed after receiving your location and order details.'},
{q:'Do you print thesis and books?',a:'We take enquiries for thesis printing, books, notes and binding. Please share page count, size, quantity and binding type.'},
{q:'How can I contact you?',a:'WhatsApp: +92 311 2365535. Instagram: @easyprint786.'}];
const rules=[{k:/\b(price|rate|cost|kitna|kitni|charges|qeemat)\b/i,a:seedFAQs[2].a},{k:/\b(bulk|wholesale|quantity|discount)\b/i,a:seedFAQs[1].a},{k:/\b(delivery|deliver|shipping|courier)\b/i,a:seedFAQs[3].a},{k:/\b(thesis|binding|book|photocopy|notes)\b/i,a:seedFAQs[4].a},{k:/\b(contact|number|whatsapp|call)\b/i,a:seedFAQs[5].a},{k:/\b(order|chahiye|chaiye|print|printing|cards|sticker|mug|banner|panaflex)\b/i,a:seedFAQs[0].a}];
function reply(input,faqs=seedFAQs,customGreeting='') {const s=String(input||'').trim();if(!s)return 'Please type your enquiry.';const roman=/\b(salam|assalam|mujhe|mujhay|bhai|kia|kya|chahiye|chaiye|kitna|kitni|karwana|batao|bhej|hain|hai|ka)\b/i.test(s);const urdu=/[\u0600-\u06ff]/.test(s);const greet=/^(hi|hello|hey|salam|assalam|aoa|اسلام|السلام)/i.test(s);if(greet)return customGreeting||(urdu?'وعلیکم السلام! ایزی پرنٹ سلوشن میں خوش آمدید۔ آپ کیا پرنٹ کروانا چاہتے ہیں؟':roman?'Wa Alaikum Assalam! Easy Print Solution mein khush aamdeed. Aapko kya print karwana hai?':'Welcome to Easy Print Solution! What would you like to print?');for(const f of faqs){if(String(f.q).toLowerCase()===s.toLowerCase())return f.a;}for(const r of rules)if(r.k.test(s))return roman?'Bilkul! '+r.a:r.a;return roman?'Ji, aap product, size, quantity aur delivery city share kar dein. Hamari team quotation confirm karegi.':'Thanks for contacting Easy Print Solution! Please tell us the product, size, quantity and delivery city for a quotation.'}
const uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random().toString(16).slice(2);


const KEY='eps-ai-agent-v1';
const initial=()=>({settings:{name:'Easy Print Solution',greeting:'',aiEnabled:false,autoReply:true},faqs:seedFAQs,contacts:[{id:'c1',name:'Sample Customer',phone:'Demo contact',channel:'Demo',status:'Open'}],messages:[{id:'m1',contact:'c1',from:'customer',text:'Assalamualaikum, visiting cards print karwane hain',time:new Date().toISOString()},{id:'m2',contact:'c1',from:'agent',text:'Wa Alaikum Assalam! Product size, quantity aur finishing bata dein.',time:new Date().toISOString()}],orders:[{id:'EPS-DEMO-001',name:'Sample Customer',service:'Visiting Cards',quantity:500,status:'New',city:'Karachi',date:new Date().toISOString(),notes:'Sample record — editable / removable'}],paused:[],activity:[]});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s?.settings&&Array.isArray(s.orders)?s:initial()}catch{return initial()}}
function save(s){localStorage.setItem(KEY,JSON.stringify(s))}
function csv(rows){const cols=['id','date','name','service','quantity','city','status','notes'];return [cols.join(','),...rows.map(r=>cols.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(','))].join('\r\n')}
function download(content,name,type='text/plain'){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}



let db=load(),page='Overview',selected='c1',search='',toastTimer;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function persist(){save(db);render()};function toast(s){const el=$('#toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2800)}
const icons={Overview:'◫',Inbox:'▤',Orders:'▦',Contacts:'♙','Knowledge Base':'◇','Agent Settings':'✦',Integrations:'⬡',Analytics:'▥',Settings:'⚙'};
const nav=Object.keys(icons);const button=(name,cls='btn')=>`<button class="${cls}" data-act="${name}">${esc(name)}</button>`;
function layout(){return `<div class="shell"><aside class="sidebar"><div class="brand"><div class="logo">EP<span>✦</span></div><div><strong>EASY PRINT</strong><small>AI Agent Studio</small></div></div><div class="sidecaption">WORKSPACE</div><nav>${nav.map(n=>`<button data-page="${n}" class="navlink ${n===page?'active':''}"><span class="sym">${icons[n]}</span><span>${n}</span>${n==='Inbox'?'<em>'+db.messages.filter(x=>x.from==='customer').length+'</em>':''}</button>`).join('')}</nav><div class="sidebottom"><span class="statusdot"></span> Workspace ready <small>Meta channels not connected</small></div></aside><main><header><div class="mobilelogo">✦ EPS Agent</div><div class="crumb">Workspace <span>/</span> <b>${page}</b></div><div class="headright"><span class="demoTag">● LOCAL WORKSPACE</span><div class="avatar">EP</div></div></header><div class="mobileNav">${nav.map(x=>`<button data-page="${x}" class="${x===page?'sel':''}">${x}</button>`).join('')}</div><div class="body">${content()}</div></main></div><div id="toast"></div>`}
function heading(t,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">EASY PRINT SOLUTION • CONTROL CENTER</div><h1>${t}</h1><p>${sub}</p></div>${action}</div>`}
function kpi(label,val,icon,desc){return `<div class="kpi"><div class="khead"><span>${label}</span><span class="kicon">${icon}</span></div><strong>${val}</strong><small>${desc}</small></div>`}
function content(){switch(page){case 'Overview':return overview();case 'Inbox':return inbox();case 'Orders':return orders();case 'Contacts':return contacts();case 'Knowledge Base':return knowledge();case 'Agent Settings':return agent();case 'Integrations':return integrations();case 'Analytics':return analytics();default:return settings()}}
function overview(){const inbound=db.messages.filter(x=>x.from==='customer').length;return `${heading('Good day, Easy Print 👋','Here is your customer support command centre.',`<button class="btn primary" data-page="Inbox">Open Inbox ↗</button>`)}<div class="notice"><span>✦</span><div><strong>Your workspace is ready for use.</strong><p>Simulator and order management work now. WhatsApp, Instagram and Facebook require official credentials, an HTTPS webhook, and platform approval before live messages work.</p></div><button data-page="Integrations">View connections ↗</button></div><section class="stats">${kpi('Total Conversations',db.contacts.length,'▤','Local workspace contacts')}${kpi('Incoming Messages',inbound,'↗','Demo and imported data')}${kpi('Order Enquiries',db.orders.length,'▦','Track requests and quotations')}${kpi('Needs Human',db.paused.length,'♙','Paused conversations')}</section><section class="twocol"><div class="panel"><div class="panelhead"><div><h2>Recent enquiries</h2><p>Customer requests at a glance</p></div><button class="textbtn" data-page="Orders">View all →</button></div>${db.orders.length?`<div class="tablewrap"><table><thead><tr><th>Enquiry</th><th>Service</th><th>Status</th></tr></thead><tbody>${db.orders.slice(-6).reverse().map(o=>`<tr><td><b>${esc(o.id)}</b><small>${esc(o.name)}</small></td><td>${esc(o.service)}</td><td><span class="pill">${esc(o.status)}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No orders added yet.</div>'}</div><div class="panel"><div class="panelhead"><div><h2>Agent quick test</h2><p>Try your business FAQ responder</p></div><span class="tag">NO API NEEDED</span></div><div class="trybox"><div class="chatlabel">Customer enquiry</div><textarea id="quickInput" placeholder="e.g. Mujhe 500 visiting cards print karwane hain"></textarea><button class="btn primary" data-act="Quick reply">Generate reply ✦</button><div id="quickAnswer" class="answer">Your suggested reply will appear here.</div></div></div></section>`}
function inbox(){let c=db.contacts.find(x=>x.id===selected)||db.contacts[0];if(c)selected=c.id;let messages=db.messages.filter(x=>x.contact===selected);return `${heading('Unified Inbox','Manage conversations and simulate automated replies.',`<button class="btn primary" data-act="New conversation">+ New conversation</button>`)}<div class="inboxlayout"><div class="panel conversationlist"><div class="panelhead"><h2>Conversations</h2><span class="tag">${db.contacts.length} contacts</span></div><div class="contactscroll">${db.contacts.map(x=>`<button class="contact ${x.id===selected?'selected':''}" data-contact="${x.id}"><div class="circle">${esc(x.name.slice(0,2)).toUpperCase()}</div><div><strong>${esc(x.name)}</strong><small>${esc(x.channel)} · ${esc(x.phone)}</small></div><span class="statusdot"></span></button>`).join('')}</div></div><div class="panel chatpanel">${c?`<div class="chathead"><div class="circle">${esc(c.name.slice(0,2)).toUpperCase()}</div><div><b>${esc(c.name)}</b><small>${esc(c.channel)} · ${esc(c.phone)}</small></div><span class="tag">${c.channel==='Demo'?'SIMULATION ONLY':'IMPORTED'}</span></div><div class="chatlog">${messages.map(m=>`<div class="bubble ${m.from==='customer'?'received':'sent'}"><div>${esc(m.text)}</div><small>${m.from==='agent'?'EPS Agent':m.from==='admin'?'You':'Customer'} · ${new Date(m.time).toLocaleTimeString('en-PK',{hour:'2-digit',minute:'2-digit'})}</small></div>`).join('')}</div><div class="chatcontrols"><label class="toggleline"><input id="pauseAI" type="checkbox" ${db.paused.includes(selected)?'checked':''}/> Pause automated replies (human handoff)</label></div><form id="messageForm" class="sendrow"><input id="messageInput" required placeholder="Enter a simulated incoming customer message..."/><button class="btn primary">Send test ↗</button></form><p class="mutedFoot">Simulator does not send messages to real social-media accounts.</p>`:'<div class="empty">Create a conversation to begin.</div>'}</div></div>`}
function orders(){return `${heading('Order Enquiries','Create, review, update and export printing requests.',`<div class="flex">${button('Export CSV','btn')}${button('Add enquiry','btn primary')}</div>`)}<div class="panel"><div class="panelhead"><h2>Enquiry tracker</h2><span class="tag">${db.orders.length} total</span></div><div class="tablewrap"><table><thead><tr><th>ID / Date</th><th>Customer</th><th>Product / Quantity</th><th>City</th><th>Status</th><th>Action</th></tr></thead><tbody>${db.orders.map(o=>`<tr><td><b>${esc(o.id)}</b><small>${new Date(o.date).toLocaleDateString('en-PK')}</small></td><td>${esc(o.name)}</td><td>${esc(o.service)}<small>Qty: ${esc(o.quantity)}</small></td><td>${esc(o.city)}</td><td><select data-status="${esc(o.id)}">${['New','Quotation Pending','Awaiting Customer','Confirmed','In Production','Completed','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="mini danger" data-deleteorder="${esc(o.id)}">Delete</button></td></tr>`).join('')}</tbody></table></div>${!db.orders.length?'<div class="empty">No enquiries yet. Add your first enquiry.</div>':''}</div><div class="hint">Customer quotations, discounts, payment confirmation and delivery dates require manual verification. Never auto-confirm unknown prices.</div>`}
function contacts(){return `${heading('Customer Contacts','Manage leads across your future messaging channels.',button('New contact','btn primary'))}<div class="panel"><div class="tablewrap"><table><thead><tr><th>Name</th><th>Contact</th><th>Source</th><th>Enquiries</th><th></th></tr></thead><tbody>${db.contacts.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td><span class="pill">${esc(c.channel)}</span></td><td>${db.messages.filter(m=>m.contact===c.id&&m.from==='customer').length}</td><td><button class="mini" data-opencontact="${c.id}">Open chat →</button></td></tr>`).join('')}</tbody></table></div></div>`}
function knowledge(){return `${heading('Knowledge Base','Approved FAQs and supported printing services.',button('Add FAQ','btn primary'))}<div class="twocol"><div class="panel"><div class="panelhead"><h2>Frequently asked questions</h2><span class="tag">${db.faqs.length} answers</span></div><div class="faqList">${db.faqs.map((f,i)=>`<div class="faq"><div><b>${esc(f.q)}</b><p>${esc(f.a)}</p></div><button class="mini danger" data-delfaq="${i}">×</button></div>`).join('')}</div></div><div class="panel"><div class="panelhead"><h2>Print services</h2><span class="tag">${services.length} examples</span></div><div class="chips">${services.map(x=>`<span>${esc(x)}</span>`).join('')}</div><div class="hint">Service list is a starter reference. Adjust approved FAQ and quotation details before production use.</div></div></div>`}
function agent(){return `${heading('AI Agent Settings','Control your brand voice and FAQ behaviour.')}<div class="twocol"><div class="panel pad"><h2>Auto reply configuration</h2><p class="sub">Local FAQ mode works with no paid API.</p><label class="field">Business name<input id="businessName" value="${esc(db.settings.name)}" /></label><label class="field">Custom welcome response<textarea id="greeting">${esc(db.settings.greeting)}</textarea></label><label class="toggleline"><input type="checkbox" id="autoEnabled" ${db.settings.autoReply?'checked':''}/> Reply automatically to simulated incoming messages</label><button class="btn primary" data-act="Save agent">Save settings</button></div><div class="panel pad"><h2>Response policy</h2><div class="policy"><b>✓ Language aware</b><p>Basic Urdu/Roman Urdu/English support in FAQ mode. AI mode can improve fluency when configured.</p><b>✓ Pricing safety</b><p>Never invent rates, offers or delivery guarantees.</p><b>✓ Human handoff</b><p>Pause any simulated conversation. Real live channels will require webhook setup.</p><b>✓ No unwanted campaigns</b><p>Outbound Meta replies must meet platform messaging policies.</p></div></div></div>`}
const connections=[['WhatsApp Business','Official WhatsApp Cloud API','META_WHATSAPP_TOKEN, META_WHATSAPP_PHONE_NUMBER_ID'],['Instagram','Official Instagram Messaging API','META_INSTAGRAM_ACCESS_TOKEN'],['Facebook Messenger','Official Facebook Page Messenger API','META_PAGE_ACCESS_TOKEN, META_PAGE_ID'],['AI Provider','Optional server-side AI provider','AI_API_KEY, AI_MODEL'],['Database','Optional Supabase REST storage for live events','SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY']];
function integrations(){return `${heading('Integrations','Secure connections for future live automations.') }<div class="notice warning"><span>!</span><div><strong>Not connected to external platforms</strong><p>Adding use cases in Meta is not the same as connecting your software. Deploy the backend, configure webhooks, add credentials and obtain necessary permissions first.</p></div></div><div class="integrationgrid">${connections.map(([name,desc,keys])=>`<div class="panel integration"><div class="inttop"><span class="inticon">${name==='WhatsApp Business'?'◉':name==='Instagram'?'◎':name==='Facebook Messenger'?'f':'✦'}</span><span class="offline">NOT CONNECTED</span></div><h2>${name}</h2><p>${desc}</p><small>Server settings: ${esc(keys)}</small></div>`).join('')}</div><div class="panel pad"><h2>Required deployment checks</h2><p class="sub">All credentials belong in Netlify server-side environment variables. Never enter secrets into this webpage or GitHub.</p><code class="endpoint">https://YOUR-SITE.netlify.app/.netlify/functions/meta-webhook</code><p class="sub">Set this callback URL in the appropriate Meta Webhooks configuration after deploying. Use the verify token you configured on Netlify.</p><a href="https://developers.facebook.com/docs/whatsapp/cloud-api" target="_blank" rel="noopener">Official Meta WhatsApp documentation ↗</a></div>`}
function analytics(){const counts=Object.fromEntries(db.contacts.map(c=>[c.channel,(db.messages.filter(m=>m.contact===c.id&&m.from==='customer').length)]));const max=Math.max(1,...Object.values(counts));return `${heading('Analytics','Workspace reporting based on locally saved data.',button('Export CSV','btn primary'))}<div class="stats">${kpi('Total Leads',db.contacts.length,'♙','All saved contacts')}${kpi('Customer Messages',db.messages.filter(m=>m.from==='customer').length,'↗','Inbound messages')}${kpi('Completed Orders',db.orders.filter(o=>o.status==='Completed').length,'✓','Marked as completed')}${kpi('Pending Quotes',db.orders.filter(o=>o.status==='Quotation Pending').length,'◇','Awaiting a quote')}</div><div class="panel pad"><h2>Enquiries by channel</h2><p class="sub">Based on test and saved workspace conversations</p>${Object.keys(counts).length?Object.entries(counts).map(([k,n])=>`<div class="barline"><span>${esc(k)}</span><div class="bar"><i style="width:${100*n/max}%"></i></div><b>${n}</b></div>`).join(''):'<div class="empty">No activity recorded.</div>'}</div>`}
function settings(){return `${heading('Workspace Settings','Backup, restore and reset your local data.') }<div class="twocol"><div class="panel pad"><h2>Data protection</h2><p class="sub">Current dashboard data is saved in this browser only. It will not sync between devices.</p><div class="actions">${button('Download backup','btn primary')}${button('Import backup','btn')}<input type="file" id="fileImport" accept="application/json" hidden/></div><hr/><button class="btn danger" data-act="Reset workspace">Reset all workspace data</button></div><div class="panel pad"><h2>Deployment status</h2><div class="settingline"><span>Dashboard</span><b class="green">READY</b></div><div class="settingline"><span>FAQ Simulator</span><b class="green">READY</b></div><div class="settingline"><span>Database Sync</span><b class="amber">NOT CONFIGURED</b></div><div class="settingline"><span>Meta Webhooks</span><b class="amber">NOT CONFIGURED</b></div><div class="settingline"><span>Live Admin Auth</span><b class="amber">NOT CONFIGURED</b></div><p class="sub">Do not process real customer data on an unprotected deployment. Production hardening and managed authentication are required.</p></div></div>`}
function promptForm(title,fields,callback){let d=document.createElement('dialog');d.innerHTML=`<form method="dialog" class="dialogform"><h2>${esc(title)}</h2>${fields.map(f=>`<label>${esc(f.label)}${f.type==='select'?`<select name="${f.key}">${f.options.map(s=>`<option>${esc(s)}</option>`).join('')}</select>`:f.type==='textarea'?`<textarea name="${f.key}" ${f.required?'required':''}></textarea>`:`<input name="${f.key}" type="${f.type||'text'}" ${f.required?'required':''} placeholder="${esc(f.placeholder||'')}"/>`}</label>`).join('')}<div class="flex end"><button class="btn" value="cancel">Cancel</button><button class="btn primary" id="dialogSave" value="save">Save</button></div></form>`;document.body.appendChild(d);d.addEventListener('close',()=>{if(d.returnValue==='save'){let obj=Object.fromEntries(new FormData(d.querySelector('form')).entries());if(fields.some(f=>f.required&&!String(obj[f.key]||'').trim())){toast('Please complete required fields.')}else callback(obj)}d.remove()});d.showModal()}
function act(name){if(name==='Quick reply'){const input=$('#quickInput').value;$('#quickAnswer').textContent=reply(input,db.faqs,db.settings.greeting);return}if(name==='New conversation'||name==='New contact'){promptForm('Add customer',[{label:'Customer name',key:'name',required:true},{label:'Contact / phone',key:'phone'},{label:'Source',key:'channel',type:'select',options:['Demo','WhatsApp (manual)','Instagram (manual)','Facebook (manual)']}],v=>{const id=uid();db.contacts.push({id,...v,status:'Open'});selected=id;page='Inbox';persist();toast('Customer saved')});return}if(name==='Add enquiry'){promptForm('New printing enquiry',[{label:'Customer name',key:'name',required:true},{label:'Service',key:'service',type:'select',options:services},{label:'Quantity',key:'quantity',type:'number',required:true},{label:'Delivery city',key:'city'},{label:'Specifications / notes',key:'notes',type:'textarea'}],v=>{db.orders.unshift({id:'EPS-'+Date.now().toString().slice(-9),date:new Date().toISOString(),status:'New',...v});persist();toast('Enquiry added')});return}if(name==='Add FAQ'){promptForm('Add approved FAQ',[{label:'Customer question',key:'q',required:true},{label:'Approved response',key:'a',required:true,type:'textarea'}],v=>{db.faqs.push(v);persist();toast('FAQ added')});return}if(name==='Save agent'){db.settings.name=$('#businessName').value.trim();db.settings.greeting=$('#greeting').value.trim();db.settings.autoReply=$('#autoEnabled').checked;persist();toast('Agent settings saved');return}if(name==='Export CSV'){download(csv(db.orders),'EPS_Orders_'+new Date().toISOString().slice(0,10)+'.csv','text/csv');toast('CSV downloaded');return}if(name==='Download backup'){download(JSON.stringify(db,null,2),'EPS_AI_Agent_Backup.json','application/json');return}if(name==='Import backup'){$('#fileImport').click();return}if(name==='Reset workspace'){if(confirm('Delete all local demo data and reset? This cannot be undone without a backup.')){localStorage.removeItem('eps-ai-agent-v1');db=load();selected='c1';persist();toast('Workspace reset')}}}
function render(){document.querySelector('#app').innerHTML=layout();const log=$('.chatlog');if(log)log.scrollTop=log.scrollHeight}
document.addEventListener('click',e=>{const pg=e.target.closest('[data-page]');if(pg){page=pg.dataset.page;render();return}const a=e.target.closest('[data-act]');if(a){act(a.dataset.act);return}const c=e.target.closest('[data-contact]');if(c){selected=c.dataset.contact;render();return}const op=e.target.closest('[data-opencontact]');if(op){selected=op.dataset.opencontact;page='Inbox';render();return}const del=e.target.closest('[data-deleteorder]');if(del&&confirm('Delete this order?')){db.orders=db.orders.filter(o=>o.id!==del.dataset.deleteorder);persist();return}const faq=e.target.closest('[data-delfaq]');if(faq&&confirm('Delete this FAQ?')){db.faqs.splice(Number(faq.dataset.delfaq),1);persist()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-status]')){const o=db.orders.find(x=>x.id===e.target.dataset.status);if(o)o.status=e.target.value;persist()}if(e.target.id==='pauseAI'){db.paused=e.target.checked?[...new Set([...db.paused,selected])]:db.paused.filter(x=>x!==selected);persist()}if(e.target.id==='fileImport'){const f=e.target.files[0];if(!f)return;f.text().then(t=>{const obj=JSON.parse(t);if(!obj?.settings||!Array.isArray(obj.orders)||!Array.isArray(obj.contacts)||!Array.isArray(obj.messages)||!Array.isArray(obj.faqs))throw Error('Invalid backup');db=obj;selected=obj.contacts[0]?.id;persist();toast('Backup imported')}).catch(()=>toast('Invalid backup file'))}});
document.addEventListener('submit',e=>{if(e.target.id!=='messageForm')return;e.preventDefault();const input=$('#messageInput');const text=input.value.trim();if(!text)return;db.messages.push({id:uid(),contact:selected,from:'customer',text,time:new Date().toISOString()});if(db.settings.autoReply&&!db.paused.includes(selected))db.messages.push({id:uid(),contact:selected,from:'agent',text:reply(text,db.faqs,db.settings.greeting),time:new Date().toISOString()});persist()});render();
</script></body></html>
